[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track-b-envs"
version = "0.1.0"
description = "Standalone LW-BenchHub-style Isaac Lab environments for Track B"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
rl = ["skrl>=2.1,<2.2", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"track_b_envs.agents.skrl" = ["*.yaml"]
